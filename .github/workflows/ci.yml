name: CI

on:
  push:
    branches: [ main ]

jobs:

  # =========================
  # 1️⃣ TEST JOB
  # =========================
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use test environment
        run: cp .env.testing .env

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            nc -z localhost 5432 && echo "Postgres is up" && exit 0
            echo "Waiting for Postgres..."
            sleep 3
          done
          exit 1

      - name: Run migrations
        run: pnpm migration:run

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Build project
        run: pnpm build


  # =========================
  # 2️⃣ BUILD & PUSH IMAGE
  # =========================
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/wedding_invitation_back:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/wedding_invitation_back:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/wedding_invitation_back:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/wedding_invitation_back:${{ github.sha }}

  # =========================
  # 3️⃣ DEPLOY
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: migrate-prod

    steps:
      - name: Trigger Dockploy
        run: curl -X POST ${{ secrets.DOCKPLOY_WEBHOOK }}