version: "3.8"

services:
  db:
    image: postgres:17
    container_name: wedding_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:17
    container_name: wedding_db_test
    env_file:
      - .env.testing
    ports:
      - "5433:5432"

  test:
    build:
      context: .
      target: test
    depends_on:
      - db_test
    env_file:
      - .env.testing
    environment:
      NODE_ENV: testing

  app:
    build:
      context: .
      target: production
    container_name: wedding_backend
    depends_on:
      - db
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      NODE_ENV: development

volumes:
  pgdata: